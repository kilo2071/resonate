[package]
name = "resonate"
version = "0.2.0"
edition = "2024"
description = "Soundboard with a virtual microphone and real-time mic effects"
license = "GPL-3.0-or-later"
repository = "https://github.com/kilo2071/Resonate"

[[bin]]
name = "resonate"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_6"] }
pipewire = "0.10"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
livi = "0.7.5"
# Preset (LilvState) reading that livi does not wrap; pinned to the versions livi
# already resolves so the raw lilv/LV2 types are the same ones livi hands us.
lilv-sys = "0.2.1"
lv2_raw = "0.2"
ksni = "0.2"
dbus = "0.9"   # GlobalShortcuts portal client (blocking, same libdbus ksni uses)

[build-dependencies]
glib-build-tools = "0.20"
